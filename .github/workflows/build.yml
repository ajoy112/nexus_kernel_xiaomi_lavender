name: Build Nexus Lavender KSUN + NoMount

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget tar zstd
          mkdir -p clang
          DOMAIN_RAW="://githubusercontent.com"
          LATEST_URL=$(curl -s "https://${DOMAIN_RAW}/ZyCromerZ/Clang/main/Clang-main-lastbuild.txt")
          wget -q "${LATEST_URL}" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang

      - name: Ganti KernelSU Lama ke KernelSU-Next Terbaru
        run: |
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile
          DOMAIN_RAW="://githubusercontent.com"
          REPO_KSUN="KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "https://${DOMAIN_RAW}/${REPO_KSUN}" | bash -

      - name: Integrasi NoMount Terbaru
        run: |
          DOMAIN_RAW="://githubusercontent.com"
          REPO_NM="maxsteeel/nomount/refs/heads/dev/kernel/setup.sh"
          curl -LSs "https://${DOMAIN_RAW}/${REPO_NM}" | bash -s master

      - name: Konfigurasi Defconfig
        run: |
          DEFCONFIG="vendor/lavender-perf_defconfig"
          [ ! -f "arch/arm64/configs/${DEFCONFIG}" ] && DEFCONFIG="lavender_defconfig"
          echo "DEFCONFIG_FILE=${DEFCONFIG}" >> $GITHUB_ENV
          echo "CONFIG_KSU=y" >> "arch/arm64/configs/${DEFCONFIG}"
          echo "CONFIG_NOMOUNT=y" >> "arch/arm64/configs/${DEFCONFIG}"

      - name: Compile Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ${{ env.DEFCONFIG_FILE }}
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 Nexus Lavender
        run: |
          DOMAIN_GH="github.com"
          REPO_AK3="projects-nexus/AnyKernel3.git"
          git clone --depth=1 -b lavender "https://${DOMAIN_GH}/${REPO_AK3}" AnyKernel3
          rm -rf AnyKernel3/.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Nexus-Lavender-KSUN-NoMount.zip *

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-ksun-${{ github.run_number }}
          files: Nexus-Lavender-KSUN-NoMount.zip
